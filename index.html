<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>전장 설정 대시보드 · 로그인</title>
<style>
/* 로그인 / 회원가입: 대시보드와 같은 색 체계 (판넬 회색 + 호박색 강조) */
:root { --bg: #eef0ee; --panel: #fff; --ink: #1d2422; --muted: #5d6763; --line: #d3d8d5; --accent: #c98a00; --accent-ink: #4a3300; --bad: #b3261e; --ok: #2e7d4f; --nav: #27302d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #151a18; --panel: #1d2421; --ink: #e5ebe7; --muted: #9aa6a0; --line: #36403b; --accent: #f0b429; --accent-ink: #1d1500; --bad: #ff8a80; --ok: #6fcf97; --nav: #0f1311; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #151a18; --panel: #1d2421; --ink: #e5ebe7; --muted: #9aa6a0; --line: #36403b; --accent: #f0b429; --accent-ink: #1d1500; --bad: #ff8a80; --ok: #6fcf97; --nav: #0f1311; color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; padding: 16px; }
.card { width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.head { background: var(--nav); color: #e6ebe8; padding: 18px 20px; }
.head b { display: block; font-size: 18px; } .head small { color: #a3aea9; font-size: 12.5px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
.tabs button { all: unset; text-align: center; padding: 12px; cursor: pointer; font-size: 14px; color: var(--muted); border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
form { padding: 20px; display: grid; gap: 12px; }
label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; }
label small { font-weight: 400; color: var(--muted); }
input[type=text], input[type=password] { font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); width: 100%; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.keep { display: flex; align-items: center; gap: 8px; font-weight: 400; color: var(--muted); }
.go { font: inherit; font-size: 15px; font-weight: 600; padding: 11px; border-radius: 6px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.go:disabled { opacity: .6; cursor: wait; }
.msg { min-height: 1.3em; margin: 0; font-size: 13px; color: var(--bad); }
.msg.ok { color: var(--ok); }
.note { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <div class="head"><b>전장 설정 대시보드</b><small>사내 전용 · 관리자 승인 회원만 이용할 수 있습니다</small></div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="t-login" aria-selected="true">로그인</button>
    <button type="button" role="tab" id="t-join" aria-selected="false">회원가입</button>
  </div>
  <form id="f-login" autocomplete="on">
    <label for="l-id">ID<input id="l-id" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label for="l-pw">비밀번호<input id="l-pw" type="password" autocomplete="current-password" required></label>
    <label class="keep"><input id="l-keep" type="checkbox"> 이 PC에서 로그인 유지 (30일)</label>
    <button class="go" id="l-go" type="submit">로그인</button>
    <p class="msg" id="l-msg" role="alert"></p>
    <p class="note">공용 PC에서는 '로그인 유지'를 체크하지 마세요. 비밀번호를 잊었으면 관리자에게 초기화를 요청하세요.</p>
  </form>
  <form id="f-join" autocomplete="off" hidden>
    <label for="j-id">ID <small>영문 소문자·숫자·_ 4~20자</small><input id="j-id" type="text" autocapitalize="off" spellcheck="false" maxlength="20" required></label>
    <label for="j-name">이름 <small>관리자가 확인할 실명</small><input id="j-name" type="text" maxlength="20" required></label>
    <label for="j-pw">비밀번호 <small>8자 이상</small><input id="j-pw" type="password" autocomplete="new-password" maxlength="64" required></label>
    <label for="j-pw2">비밀번호 확인<input id="j-pw2" type="password" autocomplete="new-password" maxlength="64" required></label>
    <button class="go" id="j-go" type="submit">가입 신청</button>
    <p class="msg" id="j-msg" role="alert"></p>
    <p class="note">가입 신청 후 관리자가 승인하면 로그인할 수 있습니다.</p>
  </form>
</main>

const AUTH = "elec-auth", KEY = "elec-k";
const $ = (id) => document.getElementById(id);
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
function readAuth() {
  for (const st of [sessionStorage, localStorage]) {
    try { const v = JSON.parse(st.getItem(AUTH) || "null"); if (v && v.token && v.exp > Date.now()) return v; } catch (e) { /* 저장소 차단 · 깨진 값 */ }
  }
  return null;
}
function clearAuth() { for (const st of [sessionStorage, localStorage]) { try { st.removeItem(AUTH); st.removeItem(KEY); } catch (e) { /* */ } } }
function saveAuth(a, keep) {
  clearAuth();
  try { (keep ? localStorage : sessionStorage).setItem(AUTH, JSON.stringify(a)); } catch (e) { /* */ }
}
async function api(body) {
  const r = await fetch(API, { method: "POST", body: JSON.stringify(body) });       // text/plain → 사전요청 없음
  if (!r.ok) throw new Error("서버 응답 " + r.status);
  return r.json();
}
// 대시보드는 한 창에 한 번만 열어야 함: document.open() 은 창(전역 변수)을 새로 만들지 않으므로 두 번 쓰면
// 대시보드의 전역 상수(LIB 등) 재선언 오류로 본문이 비어 버림 (자동 로그인 확인 + 로그인 버튼이 겹칠 때)
let opened = null;
function unlock(keyB64) { if (!opened) opened = doUnlock(keyB64).catch((e) => { opened = null; throw e; }); return opened; }
async function doUnlock(keyB64) {
  const key = await crypto.subtle.importKey("raw", b64(keyB64), "AES-GCM", false, ["decrypt"]);
  const buf = b64(BLOB);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12)));
  try { sessionStorage.setItem(KEY, keyB64); } catch (e) { /* */ }
  document.open(); document.write(html); document.close();
}
function tab(join) {
  $("t-login").setAttribute("aria-selected", String(!join)); $("t-join").setAttribute("aria-selected", String(join));
  $("f-login").hidden = join; $("f-join").hidden = !join;
  (join ? $("j-id") : $("l-id")).focus();
}
$("t-login").addEventListener("click", () => tab(false));
$("t-join").addEventListener("click", () => tab(true));
function busy(btn, on, label) { btn.disabled = on; btn.textContent = on ? "처리 중…" : label; }
const netMsg = "서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.";

let manual = false;
$("f-login").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const id = $("l-id").value.trim().toLowerCase(), pw = $("l-pw").value, keep = $("l-keep").checked;
  if (!id || !pw) { $("l-msg").textContent = "ID와 비밀번호를 입력하세요."; return; }
  manual = true;                                   // 진행 중인 자동 확인(me) 결과는 무시
  busy($("l-go"), true); $("l-msg").textContent = "";
  try {
    const r = await api({ action: "login", id, pw, keep });
    if (!r.ok) { $("l-msg").textContent = r.error || "로그인하지 못했습니다."; return; }
    saveAuth({ token: r.token, exp: r.exp, user: r.user, keep }, keep);
    await unlock(r.key);
  } catch (e) {
    if (!$("l-msg")) return;                       // 이미 대시보드로 바뀜 (중단된 요청)
    $("l-msg").textContent = e && e.name === "OperationError" ? "대시보드를 열지 못했습니다. 관리자에게 알려 주세요 (키 불일치)." : netMsg;
  } finally { if (document.getElementById("l-go")) busy($("l-go"), false, "로그인"); }
});

$("f-join").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const m = $("j-msg"); m.className = "msg";
  const id = $("j-id").value.trim().toLowerCase(), name = $("j-name").value.trim(), pw = $("j-pw").value, pw2 = $("j-pw2").value;
  if (!/^[a-z0-9_]{4,20}$/.test(id)) { m.textContent = "ID는 영문 소문자·숫자·_ 4~20자로 입력하세요."; return; }
  if (!name) { m.textContent = "이름을 입력하세요."; return; }
  if (pw.length < 8) { m.textContent = "비밀번호는 8자 이상이어야 합니다."; return; }
  if (pw !== pw2) { m.textContent = "비밀번호 확인이 일치하지 않습니다."; return; }
  busy($("j-go"), true); m.textContent = "";
  try {
    const r = await api({ action: "signup", id, name, pw });
    if (!r.ok) { m.textContent = r.error || "가입 신청을 하지 못했습니다."; return; }
    m.className = "msg ok"; m.textContent = r.message;
    $("f-join").reset(); $("l-id").value = id;
  } catch (e) { m.textContent = netMsg; }
  finally { busy($("j-go"), false, "가입 신청"); }
});

(async () => {
  if (!window.crypto || !crypto.subtle || !window.fetch) {
    $("l-msg").textContent = "이 브라우저는 지원되지 않습니다. 크롬 또는 엣지 최신 버전으로 열어 주세요.";
    $("l-go").disabled = true; $("j-go").disabled = true; return;
  }
  const a = readAuth();
  if (!a) { $("l-id").focus(); return; }
  $("l-id").value = (a.user && a.user.id) || "";
  $("l-msg").textContent = "로그인 확인 중…";
  try {
    const r = await api({ action: "me", token: a.token });
    if (manual || opened) return;                  // 그 사이 직접 로그인함 → 그쪽 결과로 열림
    if (r.ok) { saveAuth(Object.assign(a, { user: r.user }), a.keep); return await unlock(r.key); }
    clearAuth(); $("l-msg").textContent = r.error === "로그인이 필요합니다." ? "로그인이 만료되었습니다. 다시 로그인하세요." : (r.error || "");
  } catch (e) { if (manual || opened) return; $("l-msg").textContent = netMsg; }
  $("l-pw").focus();
})();
})();
</script>
