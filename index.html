<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>전장 설정 대시보드 · 로그인</title>
<style>
/* 로그인 화면: 대시보드와 같은 색 체계 (판넬 회색 + 호박색 강조) */
:root { --bg: #eef0ee; --panel: #fff; --ink: #1d2422; --muted: #5d6763; --line: #d3d8d5; --accent: #c98a00; --accent-ink: #4a3300; --bad: #b3261e; --nav: #27302d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #151a18; --panel: #1d2421; --ink: #e5ebe7; --muted: #9aa6a0; --line: #36403b; --accent: #f0b429; --accent-ink: #1d1500; --bad: #ff8a80; --nav: #0f1311; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #151a18; --panel: #1d2421; --ink: #e5ebe7; --muted: #9aa6a0; --line: #36403b; --accent: #f0b429; --accent-ink: #1d1500; --bad: #ff8a80; --nav: #0f1311; color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; padding: 16px; }
.card { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.head { background: var(--nav); color: #e6ebe8; padding: 18px 20px; }
.head b { display: block; font-size: 18px; } .head small { color: #a3aea9; font-size: 12.5px; }
form { padding: 20px; display: grid; gap: 12px; }
label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; }
input[type=password] { font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); width: 100%; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.keep { display: flex; align-items: center; gap: 8px; font-weight: 400; color: var(--muted); }
button { font: inherit; font-size: 15px; font-weight: 600; padding: 11px; border-radius: 6px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.msg { min-height: 1.3em; margin: 0; font-size: 13px; color: var(--bad); }
.note { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
<main class="card">
  <div class="head"><b>전장 설정 대시보드</b><small>사내 전용 · 비밀번호를 입력하세요</small></div>
  <form id="f" autocomplete="off">
    <label for="pw">비밀번호<input id="pw" type="password" autocomplete="current-password" required autofocus></label>
    <label class="keep"><input id="keep" type="checkbox"> 이 PC에서 로그인 유지</label>
    <button id="go" type="submit">로그인</button>
    <p class="msg" id="msg" role="alert"></p>
    <p class="note">비밀번호는 전장 담당자에게 문의하세요. 공용 PC에서는 '로그인 유지'를 체크하지 마세요.</p>
  </form>
</main>

const KEY_NAME = "elec-k";
const hex = (h) => new Uint8Array(h.match(/../g).map((x) => parseInt(x, 16)));
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const msg = (t) => { document.getElementById("msg").textContent = t; };
function getKey() { for (const st of [sessionStorage, localStorage]) { try { const v = st.getItem(KEY_NAME); if (v) return v; } catch (e) { /* 저장소 차단 */ } } return null; }
function dropKey() { for (const st of [sessionStorage, localStorage]) { try { st.removeItem(KEY_NAME); } catch (e) { /* */ } } }
async function deriveRaw(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: hex(SALT), iterations: ITER }, base, 256));
}
async function open(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const buf = b64(BLOB);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }
const toB64 = (u8) => btoa(String.fromCharCode(...u8));
(async () => {
  if (!window.crypto || !crypto.subtle) { msg("이 브라우저는 지원되지 않습니다. 크롬 또는 엣지 최신 버전으로 열어 주세요."); document.getElementById("go").disabled = true; return; }
  const saved = getKey();                           // 로그인 유지 / 같은 탭 새로고침 → 자동 열기
  if (saved) { try { return show(await open(b64(saved))); } catch (e) { dropKey(); } }   // 비밀번호 변경 시 다시 로그인
  document.getElementById("f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const pw = document.getElementById("pw").value;
    if (!pw) { msg("비밀번호를 입력하세요."); return; }
    const btn = document.getElementById("go"); btn.disabled = true; msg(""); btn.textContent = "확인 중…";
    try {
      const raw = await deriveRaw(pw);
      const html = await open(raw);
      const val = toB64(raw);
      try { sessionStorage.setItem(KEY_NAME, val); } catch (e) { /* */ }
      if (document.getElementById("keep").checked) { try { localStorage.setItem(KEY_NAME, val); } catch (e) { /* */ } }
      show(html);
    } catch (e) {
      msg("비밀번호가 맞지 않습니다."); btn.disabled = false; btn.textContent = "로그인";
      document.getElementById("pw").select();
    }
  });
})();
</script>
